name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # Unit tests on the synthetic fixture only -- never on real patient data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get install -y iverilog
      - name: Fixture is up to date
        run: |
          python tests/fixtures/make_synthetic_bids.py /tmp/regen
          diff -r /tmp/regen tests/fixtures/synthetic_bids
      - name: Tests
        run: pytest -q
