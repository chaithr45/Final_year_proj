# N4 distillation + N6 modality dropout (D36, D37) on dwn_L50_b8_lgbm40_e15bg10: the candidate final DWN.
name: n46_distill_dropout
seed: 0
model:
  type: dwn
  params:
    bits: 8
    layers:
    - 50
    n: 6
    mapping: learnable
    tau: 3.3333
    epochs: 15
    lr: 0.01
    batch: 2048
    decay_at: 0.7
    loss: ce
    device: cuda
    threads: 8
    distill_alpha: 0.5
    distill_T: 2.0
features:
  rank_by: lgbm
  top: 40
train:
  bg_ratio: 10
  modality_dropout: 0.2
  distill:
    teacher:
      type: lgbm
      params:
        n_estimators: 300
        num_leaves: 31
        learning_rate: 0.05
post:
  k:
  - 4
  - 6
  - 8
  - 10
  gate:
  - none
  - both
  - any
  n_thresholds: 40
base_config: dwn_L50_b8_lgbm40_e15bg10
