# Tier-2 variant of dwn_L50_b8_learn (scripts/make_m5_configs.py)
name: n6_late
seed: 0
model:
  type: dwn_late
  params:
    bits: 8
    n: 6
    mapping: learnable
    tau: 3.3333
    epochs: 30
    lr: 0.01
    batch: 4096
    decay_at: 0.7
    loss: ce
    device: cuda
    threads: 8
    groups:
      eeg:
        prefix:
        - eeg_
        mi_top: 30
        layers:
        - 30
      ecg:
        prefix:
        - ecg_
        - present_ecg
        layers:
        - 5
      emg:
        prefix:
        - emg_
        - present_emg
        layers:
        - 8
      mov:
        prefix:
        - mov_
        - present_mov_acc
        - present_mov_gyr
        layers:
        - 8
features: all
train:
  bg_ratio: 20
post:
  k:
  - 4
  - 6
  - 8
  - 10
  gate:
  - none
  - both
  - any
  n_thresholds: 40
base_config: dwn_L50_b8_learn
