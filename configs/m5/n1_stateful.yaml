# N1 stateful LUT network: 16 state bits fed back each second, 200 vote neurons, MI top-40 features.
# Baselines: configs/m4/dwn_l200_b8_mi40.yaml (feed-forward DWN + post-processing),
#            configs/m5/n1_stack5.yaml (DWN on stacked bits of the last 5 windows), GRU (GPU).
name: n1_stateful_s16
seed: 0
model:
  type: stateful_dwn
  params: {bits: 8, n_state: 16, n_vote: 200, n: 6, mapping: learnable, tau: 3.3333, seq_len: 60,
           pos_per_seizure: 6, neg_ratio: 5, burn_in: 10, epochs: 15, lr: 0.01, batch: 64, threads: 4}
features: {mi_top: 40}
post: {k: [4, 6, 8, 10], gate: [none, both, any], n_thresholds: 40}
