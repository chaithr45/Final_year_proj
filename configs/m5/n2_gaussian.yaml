# Tier-2 variant of dwn_L50_b8_learn (scripts/make_m5_configs.py)
name: n2_gaussian
seed: 0
model:
  type: dwn
  params:
    bits: 8
    layers:
    - 50
    n: 6
    mapping: learnable
    tau: 3.3333
    epochs: 30
    lr: 0.01
    batch: 4096
    decay_at: 0.7
    loss: ce
    device: cuda
    threads: 8
    encoder: gaussian
features:
  mi_top: 40
train:
  bg_ratio: 20
post:
  k:
  - 4
  - 6
  - 8
  - 10
  gate:
  - none
  - both
  - any
  n_thresholds: 40
base_config: dwn_L50_b8_learn
