# Tier-1 LUT-native family: LogicNets-style sparse quantized MLP (src/models/logicnets.py) on the
# MI top-40 features. Fan-in 3 x 2-bit inputs = 6 input bits, so each output bit is one LUT6.
name: logicnet_mi40
seed: 0
model:
  type: logicnet
  params: {hidden: [128, 64, 32], fan_in: 3, act_bits: 2, in_bits: 2, tau: 1.0, epochs: 30, lr: 0.01,
           batch: 4096, decay_at: 0.7, threads: 4}
features: {mi_top: 40}
train: {bg_ratio: 20}
post: {k: [4, 6, 8, 10], gate: [none, both, any], n_thresholds: 40}
