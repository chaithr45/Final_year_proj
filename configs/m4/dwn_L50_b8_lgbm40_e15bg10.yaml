# dwn_L50_b8_lgbm40 with the earlier training recipe (15 epochs, batch 2048, background ratio 10).
name: dwn_L50_b8_lgbm40_e15bg10
seed: 0
model:
  type: dwn
  params:
    bits: 8
    layers:
    - 50
    n: 6
    mapping: learnable
    tau: 3.3333
    epochs: 15
    lr: 0.01
    batch: 2048
    decay_at: 0.7
    loss: ce
    device: cuda
    threads: 8
features:
  rank_by: lgbm
  top: 40
train:
  bg_ratio: 10
post:
  k:
  - 4
  - 6
  - 8
  - 10
  gate:
  - none
  - both
  - any
  n_thresholds: 40
