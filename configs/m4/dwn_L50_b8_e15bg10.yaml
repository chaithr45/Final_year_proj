# Base DWN (dwn_L50_b8_learn) with the training recipe of the earlier dwn_l200_b8_mi40 run (15 epochs,
# batch 2048, background ratio 10), which beat the sweep recipe at 200 LUTs (event-F1 p = 0.047).
name: dwn_L50_b8_e15bg10
seed: 0
model:
  type: dwn
  params:
    bits: 8
    layers:
    - 50
    n: 6
    mapping: learnable
    tau: 3.3333
    epochs: 15
    lr: 0.01
    batch: 2048
    decay_at: 0.7
    loss: ce
    device: cuda
    threads: 8
features:
  mi_top: 40
train:
  bg_ratio: 10
post:
  k:
  - 4
  - 6
  - 8
  - 10
  gate:
  - none
  - both
  - any
  n_thresholds: 40
